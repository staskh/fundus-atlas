[project]
name = "fundus-atlas"
version = "0.1.0"
description = "Dataset fetchers and comparison code for the Fundus Atlas"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The benchmark environment, section 8.1 of PLAN-BENCHMARK.md: one environment for every upstream,
# each pinned to the commit its model page describes. Kept apart from the fetchers' dependencies so
# that building a dataset store does not require a deep-learning stack.
benchmarks = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "joblib>=1.4",
    "efficientnet_pytorch>=0.7",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "fundus-image-toolbox @ git+https://github.com/berenslab/fundus_image_toolbox@d7757e28fbf639856b53cfe00019f605af8c1f17",
    # VascX and the three Eyened packages it runs on are **cloned**, not installed — see
    # `src/upstreams/vascx.py` for why — so nothing pins them here. A clone brings the code and
    # none of the dependency metadata, so what those four declare is pinned directly below, at the
    # versions their own metadata asked for at the pinned commits. Nothing else here needs them.
    "albumentations>=1.4,<2",
    "click==8.*",
    "GPUtil==1.*",
    "huggingface-hub",
    "lightning==2.*",
    "matplotlib>=3.7,<4",
    "monai==1.5.1",
    # Genuinely a run-time requirement of retinalysis-inference, odd as that is for a tool that
    # strips notebook output. Importing the package without it fails.
    "nbstripout==0.3.9",
    "networkx>=3,<4",
    # VascX and the inference package ask for `opencv-python`; fundusprep asks for the headless
    # build. Both provide `cv2` and both were already installed side by side when these four were
    # distributions, so both are pinned rather than one being chosen for them.
    "opencv-python>=4,<5",
    "opencv-python-headless>=4,<5",
    "pydantic>=2.0,<3.0",
    "pydicom>=2.4,<4",
    "PyYAML>=5.4",
    "simplejpeg==1.*",
    "sortedcontainers==2.4.0",
    "tqdm>=4,<5",
    # The SegFormer disc-and-cup model is published as weights on the Hugging Face hub with no code
    # of its own: `transformers` is the code, and the revision is pinned in the adapter.
    "transformers>=4.44",
    # LUNet v2's disc model is published as an ONNX file and nothing else.
    "onnxruntime>=1.18",
    # AutoMorphalyzer's measuring code imports both and its own requirements.txt pins them at these
    # versions; nothing else here installs either. Bottleneck runs the moving windows in its width
    # measurement, numba the depth-first vessel tracer its authors rewrote.
    "Bottleneck==1.4.2",
    "numba==0.61.0",
    # Its `utils` imports SimpleITK at module load, to read manual annotations this benchmark never
    # supplies — so it is needed to import the measuring code at all, not to run it.
    "SimpleITK==2.4.1",
    # OCULARNet builds its architecture with this and ships only weights.
    "segmentation-models-pytorch>=0.4",
    # LUNet is a Keras 2.11 model. Its own requirements pin tensorflow 2.14 and numpy<2, which no
    # other upstream here can live with; a current tensorflow reads the same checkpoint through the
    # Keras 2 compatibility layer, which is what `TF_USE_LEGACY_KERAS` selects.
    "tensorflow>=2.18",
    "tf-keras>=2.18",
    # BF-Net publishes its weights in a Google Drive folder, which serves a file of that size behind
    # a confirmation page that a plain request cannot answer. The digest is pinned in its upstream.
    "gdown>=6.2.0",
    # Betti matching publishes no wheel, so its C++ module is built from a pinned clone: cmake
    # configures it and pybind11 is what it links against. Both are needed at run time, because the
    # build happens on first use rather than at install time.
    "cmake>=3.29",
    "pybind11>=2.12",
]

# What the analysis notebooks need to run, kept apart from the benchmark environment so that
# measuring a model does not require a plotting stack — and declared here rather than installed by
# hand, so that syncing the environment does not quietly remove it.
notebooks = [
    "ipykernel>=6.29",
    "jupyter-client>=8.6",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# VascX's inference package asks for albumentations 1.3.1, whose package import reaches for imgaug,
# which reaches for a NumPy attribute removed in NumPy 2 — and the Fundus Image Toolbox is what
# puts imgaug in the environment. 1.4 carries the same API the inference package uses and no
# imgaug import at all, which is what lets both upstreams share one environment.
#
# Since the Eyened packages became clones the 1.4 pin is an ordinary dependency above rather than
# something overridden: nothing declares 1.3.1 any more, because nothing declares anything. The
# override is kept for the toolbox, which is still installed and still drags imgaug in behind it.
override-dependencies = ["albumentations>=1.4,<2"]

[tool.hatch.metadata]
# One upstream is installed from a commit rather than from a release — the Fundus Image Toolbox,
# whose PyPI release trails the commit its pages describe. Section 8 of PLAN-BENCHMARK.md. The
# others pinned by commit are clones and need nothing from the installer.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/datasets", "src/upstreams", "src/models", "src/benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Deprecations inside the upstreams, which are pinned and not ours to fix.
filterwarnings = [
    "ignore:`torch.jit.*` is deprecated:FutureWarning",
    "ignore:Got processor for keypoints:UserWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# A model adapter is named for its catalogue page — `docs/models/fit-quality.md` ↔
# `src/models/fit-quality.py` — and those slugs carry hyphens, which no module name may. The
# adapters are loaded from their path rather than imported, so the name is deliberate.
"src/models/*-*.py" = ["N999"]
# An adapter catches whatever its upstream raises and turns it into a failed prediction: one
# unreadable photograph must not lose a run of three thousand.
"src/models/*.py" = ["BLE001"]
# The same rule one layer up: a benchmark turns whatever a model raises into a failed row rather
# than letting one photograph end the run, and the same for the disc a camera scale is inferred
# from — one unreadable photograph must not lose a group.
"src/benchmarks/*.py" = ["BLE001"]
"src/datasets/fetch_um_resolution.py" = ["BLE001"]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
