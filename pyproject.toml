[project]
name = "fundus-atlas"
version = "0.1.0"
description = "Dataset fetchers and comparison code for the Fundus Atlas"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
